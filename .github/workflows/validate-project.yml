name: Validate Godot project assets

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GLB validation dependency
        run: python -m pip install trimesh pygltflib
      - name: Validate resources and manifests
        run: python tools/validate_project.py
